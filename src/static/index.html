<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%231a237e'>📚</text></svg>" />
  </head>
  <body>
    <header>
      <div class="header-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" class="logo-icon">
          <defs>
            <linearGradient id="roofGradient" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#ff9500;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#ff6f00;stop-opacity:1" />
            </linearGradient>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <!-- Circular background -->
          <circle cx="60" cy="60" r="58" fill="#ffffff" stroke="#1a237e" stroke-width="3"/>
          <!-- School building -->
          <rect x="25" y="50" width="70" height="50" fill="#e3f2fd" stroke="#1a237e" stroke-width="2.5" rx="3"/>
          <!-- Roof -->
          <polygon points="25,50 60,20 95,50" fill="url(#roofGradient)" stroke="#1a237e" stroke-width="2.5" filter="url(#glow)"/>
          <!-- Door -->
          <rect x="52" y="70" width="16" height="30" fill="#8b5a00" rx="2"/>
          <circle cx="65" cy="85" r="2" fill="#ffd700"/>
          <!-- Windows -->
          <rect x="32" y="58" width="10" height="10" fill="#64b5f6" stroke="#1a237e" stroke-width="1" rx="1"/>
          <rect x="48" y="58" width="10" height="10" fill="#64b5f6" stroke="#1a237e" stroke-width="1" rx="1"/>
          <rect x="80" y="58" width="10" height="10" fill="#64b5f6" stroke="#1a237e" stroke-width="1" rx="1"/>
          <rect x="32" y="74" width="10" height="10" fill="#64b5f6" stroke="#1a237e" stroke-width="1" rx="1"/>
          <rect x="80" y="74" width="10" height="10" fill="#64b5f6" stroke="#1a237e" stroke-width="1" rx="1"/>
          <!-- Flag pole -->
          <rect x="87" y="15" width="3" height="20" fill="#1a237e"/>
          <!-- Flag -->
          <polygon points="90,15 90,25 100,20" fill="#ff6f00"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>Mergington High School</h1>
        <h2>Extracurricular Activities</h2>
      </div>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2023 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
